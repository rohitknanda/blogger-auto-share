name: Share latest Blogger post to Facebook + Telegram

on:
  schedule:
    # Every 30 minutes (UTC). Widen if you post less often, e.g. "0 */2 * * *".
    - cron: "*/30 * * * *"
  workflow_dispatch:        # manual "Run workflow" button

permissions:
  contents: write           # needed to commit state.json back

concurrency:
  group: social-share
  cancel-in-progress: false # never let two runs race and double-post

jobs:
  share:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run share agent
        env:
          BLOGGER_API_KEY: ${{ secrets.BLOGGER_API_KEY }}
          BLOG_ID:         ${{ secrets.BLOG_ID }}
          FB_PAGE_ID:      ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN:   ${{ secrets.FB_PAGE_TOKEN }}
          TG_BOT_TOKEN:    ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID:      ${{ secrets.TG_CHAT_ID }}
          MAX_CATCHUP:     "1"
          DRY_RUN:         "false"
          ENABLE_FB:       "true"
          ENABLE_TG:       "true"
        run: python share_to_social.py

      - name: Commit updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [[ -n "$(git status --porcelain state.json)" ]]; then
            git add state.json
            git commit -m "chore: update shared-posts state [skip ci]"
            git push
          else
            echo "No state change to commit."
          fi
